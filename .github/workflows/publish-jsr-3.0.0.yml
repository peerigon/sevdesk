# One-shot: finish the incomplete 3.0.0 release (JSR was skipped when GH Packages failed).
# Delete this workflow after it succeeds.
name: Publish JSR 3.0.0

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  publish-jsr:
    name: Publish @peerigon/sevdesk@3.0.0 to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout v3.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v3.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Set version 3.0.0
        run: |
          node --input-type=module -e "
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const file of ['package.json', 'jsr.json']) {
            const json = JSON.parse(readFileSync(file, 'utf8'));
            json.version = '3.0.0';
            writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          "

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty
